<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="g" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0b0f18" />
      <stop offset="100%" stop-color="#071018" />
    </linearGradient>
    <pattern id="dots" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="transparent" />
      <circle cx="15" cy="15" r="2.5" fill="rgba(255,255,255,0.02)" />
      <circle cx="60" cy="60" r="2.5" fill="rgba(255,255,255,0.02)" />
      <circle cx="105" cy="105" r="2.5" fill="rgba(255,255,255,0.02)" />
    </pattern>
    <filter id="grain">
      <feTurbulence baseFrequency="0.8" numOctaves="2" stitchTiles="stitch" type="fractalNoise" result="t"/>
      <feColorMatrix in="t" type="saturate" values="0" result="cm"/>
      <feComponentTransfer in="cm">
        <feFuncA type="table" tableValues="0 0.06"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="cm" mode="overlay"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#g)" />

  <!-- subtle decorative waves -->
  <g fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="2">
    <path d="M0,200 C300,150 600,250 900,200 C1200,150 1500,250 1920,200"/>
    <path d="M0,300 C300,250 600,350 900,300 C1200,250 1500,350 1920,300"/>
    <path d="M0,400 C300,350 600,450 900,400 C1200,350 1500,450 1920,400"/>
  </g>

  <!-- dotted texture -->
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6" />

  <!-- subtle vignette -->
  <rect width="100%" height="100%" fill="black" opacity="0.25"/>

</svg>
